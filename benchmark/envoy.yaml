# Envoy in front of the app: :83 without makit (baseline), :84 asking makit through ext_authz (the setup
# `makit shield snippet envoy` prints, and what Envoy Gateway and Istio configure).
static_resources:
  listeners:
    - name: plain
      address: { socket_address: { address: 0.0.0.0, port_value: 83 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: plain
                route_config: { virtual_hosts: [{ name: app, domains: ["*"], routes: [{ match: { prefix: "/" }, route: { cluster: app } }] }] }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
    - name: asking
      address: { socket_address: { address: 0.0.0.0, port_value: 84 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: asking
                use_remote_address: true   # append the peer to X-Forwarded-For: makit reads the chain from the right
                route_config: { virtual_hosts: [{ name: app, domains: ["*"], routes: [{ match: { prefix: "/" }, route: { cluster: app } }] }] }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: true
                      http_service:
                        server_uri: { uri: "http://makit:9180", cluster: makit, timeout: 0.25s }
                        path_prefix: /check
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: x-forwarded-for
                              - exact: forwarded
                              - exact: x-real-ip
                              - exact: user-agent
                              - exact: referer
                              - exact: accept
                              - exact: accept-encoding
                              - exact: accept-language
                              - exact: sec-ch-ua
                              - exact: sec-fetch-mode
                              - exact: next-action
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
    - name: app
      type: STRICT_DNS
      load_assignment: { cluster_name: app, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: app, port_value: 80 } } } }] }] }
    - name: makit
      type: STRICT_DNS
      load_assignment: { cluster_name: makit, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: makit, port_value: 9180 } } } }] }] }
