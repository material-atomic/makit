{{- if and .Values.cluster.enabled (not .Values.cluster.existingSecret) }}
{{- $name := include "makit.clusterSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "makit.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # The key replicas sign their messages with: generated once, kept across upgrades.
  secret: {{ if $old }}{{ index $old.data "secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}
