{{- if .Values.networkPolicy.enabled }}
# The cluster port carries ban lists: only makit pods may reach it. /check and /metrics (admin) stay reachable inside
# the cluster for gateways, kubelet probes and Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "makit.fullname" . }}
  labels: {{- include "makit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "makit.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: admin }]
    {{- if .Values.cluster.enabled }}
    - from:
        - podSelector:
            matchLabels: {{- include "makit.selector" . | nindent 14 }}
      ports: [{ port: cluster }]
    {{- end }}
{{- end }}
