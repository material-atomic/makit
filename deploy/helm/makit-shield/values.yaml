# makit-shield. Gateways (Envoy Gateway, Istio, Traefik, ingress-nginx) ask it on /check before every request:
#   makit shield snippet envoy-gateway --service <release>-makit-shield --namespace <namespace>
# Docs: https://makit.sh/docs.html?p=shield

replicaCount: 2

image:
  repository: ghcr.io/material-atomic/makit-shield
  tag: ""                # default: the chart's appVersion
  pullPolicy: IfNotPresent

# shield.yaml, as a map. Changes are applied by the running pods within seconds (no restart), except cluster:.
# Check a file before you use it: makit shield config check, or the playground on makit.sh.
config:
  mode: observe          # see what it would block first; then block
  ask: true
  admin: "0.0.0.0:9180"
  client_ip_header: X-Forwarded-For
  trusted_proxies: [vpc] # the load balancer and gateway pods; narrow to their subnets when you can
  report:
    every: 5m

# Replicas share bans, allow entries, rate limits and scores (cluster: in shield.yaml, filled in by the chart).
cluster:
  enabled: true
  port: 9181
  sync: 250ms           # a limit can be exceeded by about (request rate × sync) between two syncs
  # A Secret with key "secret" (at least 32 characters). Empty: the chart creates one and keeps it across upgrades.
  existingSecret: ""

# makit notify channels: a Secret with key notify.yaml (makit notify add … writes that format).
notify:
  existingSecret: ""

# Your own rules, scoring or bot catalog files: a ConfigMap mounted at /etc/makit/security (they override the
# bundled catalog).
catalog:
  existingConfigMap: ""

# The pods' ServiceAccount: annotate it for IRSA (eks.amazonaws.com/role-arn) when aws_waf: pushes bans to AWS WAF.
serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 9180

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Only the makit pods may reach the cluster port; /check and /metrics stay open inside the cluster (makit itself
# answers only private callers).
networkPolicy:
  enabled: true

serviceMonitor:
  enabled: false          # needs the Prometheus Operator CRDs
  interval: 30s

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
