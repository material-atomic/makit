name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -e LC_ALL=C.UTF-8 -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -x -s bash \
            bin/makit lib/common.sh lib/cmd/*.sh install.sh tests/*.sh scripts/*.sh

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: gofmt, vet, test (loads the repository's security catalog)
        working-directory: core
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: makit in ubuntu:24.04 and debian:12 containers
        run: tests/smoke.sh

  scan-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: build makit-core
        working-directory: core
        run: CGO_ENABLED=0 go build -trimpath -o ../dist/makit-core-linux-amd64 .
      - name: replay a React2Shell-style compromise and check every finding
        run: tests/scan-e2e.sh

  # makit-shield in a real Kubernetes cluster: the Helm chart with 3 replicas; bans, live config and rate limits
  # shared across them, checked from a pod.
  k8s:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: azure/setup-helm@v4
      - name: helm lint, then tests/k8s-e2e.sh
        run: |
          helm lint deploy/helm/makit-shield
          tests/k8s-e2e.sh

  # Real VMs: run makit init for real, twice (idempotency), then verify every managed part is in place.
  vm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: install from this checkout
        run: |
          (cd core && CGO_ENABLED=0 go build -trimpath -o ../libexec/makit-core .)
          sudo mkdir -p /opt/makit && sudo cp -r . /opt/makit/ci && sudo ln -sfn /opt/makit/ci/bin/makit /usr/local/bin/makit
          makit version
      - name: makit init --dry-run
        run: sudo makit --dry-run init --sysctl opensearch
      - name: makit init (real; SSH stays as configured by the runner)
        run: sudo makit init --sysctl opensearch --no-ssh-harden
      - name: makit init again (must be harmless)
        run: sudo makit init --sysctl opensearch --no-ssh-harden
      - name: containers may only use HTTPS (+ DNS) to the internet
        run: |
          sudo makit firewall --docker --egress "443/tcp"
          code=$(docker run --rm curlimages/curl -sS -m 15 -o /dev/null -w '%{http_code}' https://example.com)
          echo "https: $code"; test "$code" = 200
          if docker run --rm curlimages/curl -sS -m 10 -o /dev/null http://example.com; then echo "http was not blocked"; exit 1; fi
          sudo journalctl -k --no-pager | grep -m3 'makit egress'
      - name: scheduled scan runs and writes a report
        run: |
          sudo makit schedule scan daily --consent
          sudo systemctl start makit-scan.service
          sudo ls /var/log/makit/scans/ | grep -q '^scan-.*\.json$'
          sudo makit schedule status
      - name: shield — Caddy asks makit; makit in front; bans, rules, allowlist, kernel set, bots, analyze, reports, notify
        run: |
          set -x
          sudo makit shield on
          # The local proxies stand in for Cloudflare here: trust loopback so CF-Connecting-IP is used.
          sudo sed -i 's#^trusted_proxies: .*#trusted_proxies: [cloudflare, 127.0.0.1/32]#; s#^kernel_block: .*#kernel_block: true#' /etc/makit/shield.yaml
          printf 'listeners:\n  - name: edge\n    listen: "127.0.0.1:8090"\n    upstream: http://127.0.0.1:8091\n' | sudo tee -a /etc/makit/shield.yaml
          sudo sed -i 's#^listeners: \[\].*##' /etc/makit/shield.yaml
          sudo makit shield edge on
          sudo systemctl restart makit-shield && sleep 2
          sudo sed -i 's#every: 5m#every: 1m#' /etc/makit/shield.yaml
          # a webhook receiver for makit notify
          cat > /tmp/hook.py <<'PY'
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  open('/tmp/hook.log', 'ab').write(body + b'\n')
                  self.send_response(204); self.end_headers()
          http.server.HTTPServer(('127.0.0.1', 8099), H).serve_forever()
          PY
          (python3 /tmp/hook.py &) ; sleep 1
          sudo makit notify add webhook --name ci --url http://127.0.0.1:8099/hook --min-level info
          sudo makit notify list
          sudo makit notify test ci && grep -q 'makit test message' /tmp/hook.log
          (mkdir -p /tmp/www && echo hello > /tmp/www/index.html && cd /tmp/www && python3 -m http.server 8091 --bind 127.0.0.1 &) ; sleep 1
          cat > /tmp/Caddyfile <<'CADDY'
          {
          	admin off
          	auto_https off
          }
          (makit_shield) {
          	forward_auth 127.0.0.1:9180 {
          		uri /check
          		header_up X-Makit-Peer {remote_host}
          		header_up X-Makit-Client {http.request.header.CF-Connecting-IP}
          	}
          }
          :8088 {
          	import makit_shield
          	respond "ok"
          }
          CADDY
          docker run -d --name caddy --network host -v /tmp/Caddyfile:/etc/caddy/Caddyfile caddy:2
          sleep 3
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          sudo makit shield ban 203.0.113.9 --for 1h --reason ci && sleep 3   # the gate reloads lists within 2 s
          for port in 8088 8090; do
            test "$(code -H 'CF-Connecting-IP: 198.51.100.20' http://127.0.0.1:$port/)" = 200
            test "$(code -H 'CF-Connecting-IP: 203.0.113.9' http://127.0.0.1:$port/)" = 403
          done
          test "$(code -H 'CF-Connecting-IP: 198.51.100.30' http://127.0.0.1:8088/.env)" = 403   # rule + auto-ban
          sleep 1
          test "$(code -H 'CF-Connecting-IP: 198.51.100.30' http://127.0.0.1:8088/)" = 403        # still banned
          sudo makit shield allow 198.51.100.30 && sleep 3
          test "$(code -H 'CF-Connecting-IP: 198.51.100.30' http://127.0.0.1:8088/)" = 200        # allowlist wins
          sudo nft list set inet makit_shield block4 | grep -q 203.0.113.9
          printf '# feed\n192.0.2.0/24 ; test range\n198.51.100.200\n' > /tmp/feed.txt
          sudo makit shield import /tmp/feed.txt --name ci-feed --for 1h --reason "ci feed" && sleep 3
          test "$(code -H 'CF-Connecting-IP: 192.0.2.77' http://127.0.0.1:8088/)" = 403        # bulk list
          sudo nft list set inet makit_shield list4net | grep -q 192.0.2.0/24
          # bots: a fake Googlebot is caught once reverse DNS answers; policy per category; GoesBot passes; limits
          ua() { curl -s -o /dev/null -w '%{http_code}' -A "$1" -H "CF-Connecting-IP: $2" "http://127.0.0.1:8088${3:-/}"; }
          ua "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" 198.51.100.40 >/dev/null; sleep 4
          test "$(ua 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' 198.51.100.40)" = 403
          sudo makit shield bots set ai-crawler block
          sudo makit shield bots set claude-user "limit 2/1m" && sleep 3   # unverifiable agent (ChatGPT-User from a non-OpenAI IP is a fake: 403)
          test "$(ua 'Mozilla/5.0 (compatible; GPTBot/1.2; +https://openai.com/gptbot)' 198.51.100.41)" = 403
          test "$(ua 'GoesBot/1.0 (+https://goes.vn/bot)' 198.51.100.42)" = 200       # seo default: log
          sudo makit shield bots set seo block && sleep 3
          test "$(ua 'GoesBot/1.0 (+https://goes.vn/bot)' 198.51.100.42)" = 403       # no favours: blocked with its category
          test "$(ua 'ChatGPT-User/1.0' 198.51.100.43)" = 403          # published ranges: not OpenAI → spoofed
          ua 'Claude-User/1.0' 198.51.100.44 >/dev/null; ua 'Claude-User/1.0' 198.51.100.46 >/dev/null
          test "$(ua 'Claude-User/1.0' 198.51.100.45)" = 429
          # bot IP sources: a URL refreshed on a schedule and a typed IP; their agents are recognised by IP alone
          printf '# partner crawler\n198.51.100.50\n' > /tmp/www/partner.txt
          sudo makit shield bots source add http://127.0.0.1:8091/partner.txt --agent partner --category monitoring
          sudo makit shield bots ip add office 198.51.100.60 --category monitoring && sleep 3
          sudo makit shield bots sources
          test "$(ua 'Mozilla/5.0 Chrome/126.0' 198.51.100.50 /.env)" = 200     # verified + allow: no rules
          test "$(ua 'Mozilla/5.0 Chrome/126.0' 198.51.100.60 /.env)" = 200
          sudo makit shield bots robots | grep -q 'User-agent: GPTBot'
          # log analysis with the same policy
          printf '%s\n' '85.204.70.96 - - [21/May/2026:14:24:01 +0000] "GET /wp1/wp-includes/wlwmanifest.xml HTTP/1.1" 500 0 "-" "-"' \
            '91.238.181.96 - - [21/May/2026:14:26:11 +0000] "\x03\x00\x00/*\xE0\x00\x00\x00\x00\x00Cookie: mstshash=Administr" 400 157 "-" "-"' > /tmp/access.log
          sudo makit shield analyze /tmp/access.log --verify=false | tee /tmp/analyze.txt
          grep -q 'WordPress probing' /tmp/analyze.txt && grep -q 'RDP scan' /tmp/analyze.txt
          sudo makit shield edge off && sleep 3
          if curl -s -m 3 http://127.0.0.1:8090/ >/dev/null; then echo "edge still listening"; exit 1; fi
          sudo makit shield list
          sudo makit shield log --blocked
          sudo makit shield status
          # the batch report is written and sent by itself (report.every is 1m here)
          for i in $(seq 1 30); do ls /var/log/makit/shield/reports/*.txt >/dev/null 2>&1 && break; sleep 5; done
          sudo makit shield report | tee /tmp/report.txt
          grep -q 'suspicious IPs' /tmp/report.txt
          for i in $(seq 1 12); do grep -q 'suspicious IPs' /tmp/hook.log 2>/dev/null && break; sleep 5; done
          grep -q 'suspicious IPs' /tmp/hook.log
          sudo makit shield off && sleep 2
          test "$(code -H 'CF-Connecting-IP: 203.0.113.9' http://127.0.0.1:8088/)" = 200          # off = pass
          docker rm -f caddy
      - name: every part in place
        run: |
          sudo makit list
          sudo makit list --json | python3 -c '
          import json, sys
          bad = [c["title"] + ": " + c["detail"] for c in json.load(sys.stdin) if not c["installed"] and c["id"] not in ("upgrade", "ssh")]
          print("\n".join(bad)); sys.exit(1 if bad else 0)'
      - name: makit status and a read-only scan of the runner
        run: |
          sudo makit status
          sudo makit scan --consent || test $? -eq 1
