name: image

# makit-shield image: built for amd64 and arm64 on every release tag, pushed to ghcr.io, with an SBOM and build
# provenance attached, and signed keyless with cosign (the signature names this workflow and the tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # keyless signing

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER}/makit-shield
          if [[ $GITHUB_REF_TYPE == tag ]]; then     # a release: its version, and latest
            v=${GITHUB_REF_NAME#v}
            echo "tags=$img:$v,$img:latest" >> "$GITHUB_OUTPUT"
          else                                      # by hand from a branch: never latest
            v=edge-${GITHUB_SHA::7}
            echo "tags=$img:$v" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          sbom: true
          provenance: mode=max
      - name: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/makit-shield@${DIGEST}"
      - name: verify, as a user would
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "ghcr.io/${GITHUB_REPOSITORY_OWNER}/makit-shield@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "signed and verified: ghcr.io/${GITHUB_REPOSITORY_OWNER}/makit-shield@${DIGEST}"
      - uses: azure/setup-helm@v4
        if: github.ref_type == 'tag'
      - name: chart to ghcr.io (oci://ghcr.io/<owner>/charts/makit-shield)
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/makit-shield --version "$VERSION" --app-version "$VERSION" -d /tmp/chart
          helm push "/tmp/chart/makit-shield-$VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
